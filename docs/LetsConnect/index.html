<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- <title>Document</title> -->
    <title>returnXERO | 2D/3D Website Design & Development Agency</title>
    <link rel="preload" href="/roboto_mono_family/RobotoMono-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <script src="/navbar.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="/Global.css">
    <link rel="stylesheet" href="letsConnectGlobal.css">
    <link rel="stylesheet" href="letsConnectFAQSection.css">
    <link rel="stylesheet" href="/topBar.css">
    <link rel="stylesheet" href="/LetsConnect/letsConnectFAQSection.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DRVRJX8ZHP"></script>
    <script>
     window.dataLayer = window.dataLayer || [];
     function gtag(){dataLayer.push(arguments);}
     gtag('js', new Date());
     gtag('config', 'G-DRVRJX8ZHP');
    </script>

</head>
<body>
        
    <rx-navbar>
            <!-- cheating mat kar lavde - Engilsh me bolu to Do not cheat you bastard-->
    </rx-navbar>

    <div id="mainContainer">

        <div id="leftSec">

            <form id="leftSecForm">

                <div id="leftHalf">
                    <!-- id="connect-form" -->
                
                    <!-- 1. Name -->
                    <div class="leftHalfItems">
                        <label for="name">Name</label>
                        <input
                            class="leftHalfInputs"
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Your name"
                            required
                        >
                    </div>


                    <!-- 2. Phone -->
                    <div class="leftHalfItems">
                        <label for="phone">Phone Number</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Your phone number"
                            required
                        >
                    </div>


                    <!-- 3. Email -->
                    <div class="leftHalfItems">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >
                    </div>


                    <!-- 4. Organization -->
                    <div class="leftHalfItems">
                        <label for="organization">Organization <span>(Optional)</span></label>
                        <input
                            type="text"
                            id="organization"
                            name="organization"
                            placeholder="Your organization"
                        >
                    </div>

                    <!-- 6. Budget (custom dropdown) -->
                    <div class="leftHalfItems">
                    <label id="budget-label">Estimated Budget</label>

                    <div class="rx-select" id="budget-select">
                        <input type="hidden" name="budget" id="budget" value=""/>

                        <button
                        type="button"
                        class="rx-select-trigger"
                        id="budget-trigger"
                        aria-haspopup="listbox"
                        aria-expanded="false"
                        aria-labelledby="budget-label budget-trigger"
                        >
                        <span class="rx-select-value" data-placeholder="Select your budget">
                            Select your budget
                        </span>
                        <span class="rx-select-chevron" aria-hidden="true"></span>
                        </button>

                        <ul class="rx-select-menu" role="listbox" id="budget-menu" aria-labelledby="budget-label" tabindex="-1">
                        <li role="option" data-value="₹2,500 - ₹5,000">₹2,500 - ₹5,000</li>
                        <li role="option" data-value="₹5,000 - ₹8,000">₹5,000 - ₹8,000</li>
                        <li role="option" data-value="₹8,000 - ₹10,000">₹8,000 - ₹10,000</li>
                        <li role="option" data-value="₹10,000 - ₹15,000">₹10,000 - ₹15,000</li>
                        <li role="option" data-value="₹20,000+">₹20,000+</li>
                        <li role="option" data-value="Not sure yet">Not sure yet</li>
                        </ul>
                    </div>

                    <span class="rx-select-error" id="budget-error" aria-live="polite"></span>
                    </div>

                    <!-- 7. Services -->
                    <fieldset>

                        <legend>
                            What service are you looking for?
                        </legend>

                        <div class="services">
                        <label>
                            <input
                                type="checkbox"
                                name="services"
                                value="3D website"
                            >3D website
                        </label>
                        </div>

                        <div class="services">
                        <label>
                            <input
                                type="checkbox"
                                name="services"
                                value="E-commerce / Backend"
                            >
                            E-commerce / Backend
                        </label>
                        </div>

                        <div class="services">
                        <label>
                            <input
                                type="checkbox"
                                name="services"
                                value="Portfolio"
                            >
                            Portfolio
                        </label>
                        </div>

                        <div class="services">
                        <label>
                            <input
                                type="checkbox"
                                name="services"
                                value="other"
                            >
                            Other (describe in aditional note )
                        </label>
                        </div>   

                    </fieldset>
                
                </div>

    
                
                <div id="rightHalf">
                    
                    
                    <input
                    type="text"
                        id="date"
                        name="date"
                        placeholder="Select your prefered date & time"
                        readonly
                        required
                    >

                    <!-- 8. Additional Note -->
                    <div>
                        <label for="message">
                            Additional Note
                        </label>

                        <textarea class="textarea"
                            id="message"
                            name="message"
                            placeholder="Tell us about your project..."
                            rows="6"
                        ></textarea>
                    </div>

                    <div>
                        <p id="Note">NOTE - we will send you a confirmation link on your email. Please be patient</p>
                    </div>

                    <div class="TNS">
                        <label>
                            <input
                                type="checkbox"
                                id="terms"
                                name="terms"
                                value="Yes"
                                required>
                            <a href=""><span class="TNSHighlight">Terms & Condition</span></a>
                        </label>
                    </div>
                    <!-- Submit -->
                    <button id="submitInfo" type="submit">
                        <span id="submitInfoText">Let's Connect</span>
                    </button>

                </div>

            </form>

        </div>

    </div>

    <div id="rightSec">
        
        <div class="content">
            Let's Connect
        </div>

        <div class="content">
            FAQs
        </div>

    </div>

    <div id="FAQSection">


    </div>

    <div id="submitOverlay"> 
        <div id="submitPopup">
            <h3>SUCCCCIIICCESSSSSSS</h3>
            <div id="xbutton"></div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="letsConnect.js"></script>
    <!-- <script src="scalar.js"></script> -->
</body>
</html>
